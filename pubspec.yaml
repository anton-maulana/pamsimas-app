name: pamsimas_app
description: Pamsimas Frontend
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.3.1
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.1.2
  flutter_dotenv: ^5.0.2
  jwt_decoder: ^2.0.1
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0
